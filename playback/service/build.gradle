plugins {
    id("com.android.library")
}
apply from: "../../common.gradle"
apply from: "../../playFlavor.gradle"

android {
    defaultConfig {
        externalNativeBuild {
            cmake {
                cppFlags ''
            }
        }

        // Tell this specific module to read local.properties
        def localProperties = new Properties()
        def localPropertiesFile = rootProject.file("local.properties")
        if (localPropertiesFile.exists()) {
            localPropertiesFile.withReader('UTF-8') { reader ->
                localProperties.load(reader)
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    namespace "de.danoeh.antennapod.playback.service"

    tasks.withType(JavaCompile) {
        // There is no way to suppress this specific warning, so we have to opt out of all:
        // class file for com.google.j2objc.annotations.ReflectionSupport$Level not found
        options.compilerArgs.removeAll { it == "-Werror" }
    }


    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }
}

dependencies {
    implementation project(':event')
    implementation project(':model')
    implementation project(':net:common')
    implementation project(':net:sync:service-interface')
    implementation project(':playback:base')
    implementation project(':playback:cast')
    implementation project(':storage:database')
    implementation project(':storage:preferences')
    implementation project(':ui:app-start-intent')
    implementation project(':ui:common')
    implementation project(':ui:episodes')
    implementation project(':ui:i18n')
    implementation project(':ui:notifications')
    implementation project(':ui:widget')
    implementation project(':ui:chapters')

    annotationProcessor "androidx.annotation:annotation:$annotationVersion"
    implementation "androidx.car.app:app:1.4.0-rc02"
    implementation "androidx.core:core:$coreVersion"
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.media:media:$mediaVersion"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-session:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"

    implementation "io.reactivex.rxjava3:rxandroid:$rxAndroidVersion"
    implementation "io.reactivex.rxjava3:rxjava:$rxJavaVersion"
    implementation "org.greenrobot:eventbus:$eventbusVersion"
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    implementation "org.apache.commons:commons-lang3:$commonslangVersion"
    implementation "com.squareup.okhttp3:okhttp:4.12.0"

    testImplementation "junit:junit:$junitVersion"
    testImplementation "org.mockito:mockito-core:$mockitoVersion"
}
